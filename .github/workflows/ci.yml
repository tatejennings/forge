name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-version matrix across every supported Swift version.
  #
  # Runs on macOS, not Linux: Forge supports Apple platforms only (see the
  # Requirements table in README.md), and no supported Forge user ships to
  # Linux. We use swift-actions/setup-swift (which installs swift.org Darwin
  # toolchains) so the matrix can cover every supported Swift version
  # regardless of which Xcode the runner image bundles.
  #
  # Each Swift version is pinned to a runner image whose macOS SDK that compiler
  # can build against: an older swift.org toolchain cannot parse a much newer
  # SDK's module map, so Swift 5.10 runs on macos-14 (MacOSX14 SDK) while the
  # 6.x toolchains run on macos-15. Bump these pairs as runner images change.
  #
  # Swift 5.10 is build-only: it is Forge's advertised minimum and the library
  # source must compile under it, but the test suite uses Swift Testing
  # (`import Testing`), which ships only with Swift 6.0+, so the full suite
  # runs on 6.0/6.1/6.2.
  test-apple:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { swift: "5.10", os: macos-14, test: false }
          - { swift: "6.0", os: macos-15, test: true }
          - { swift: "6.1", os: macos-15, test: true }
          - { swift: "6.2", os: macos-15, test: true }
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        if: matrix.test
        run: swift test

  # Build + test with the runner's default Xcode toolchain — the compiler most
  # developers actually use, as opposed to the swift.org toolchains the matrix
  # above installs.
  test-macos:
    name: Test (macOS, default Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  # The matrix above builds in Swift 5 language mode (the package's tools-version),
  # so it does not exercise strict-concurrency checking. This job compiles the target
  # under the Swift 6 language mode with complete strict concurrency — the gate that
  # keeps Forge's `@unchecked Sendable` and global-state claims honest.
  strict-concurrency:
    name: Strict concurrency (Swift 6 mode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build under complete strict concurrency
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -swift-version -Xswiftc 6

  # Regression test for the stripped-binary override bug (0.6.0). Test bundles
  # are never symbol-stripped, so the regular suite cannot reproduce the
  # archive-time environment in which "\(keyPath)" degrades to
  # "<computed 0x… (Type)>" — the environment where KeyPath overrides on
  # Forge <= 0.5.1 were silently mis-keyed and consumer apps crashed at launch.
  # This job builds a release executable, strips it like an archive would, and
  # asserts the KeyPath override APIs still resolve.
  stripped-override:
    name: Stripped-binary override regression
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run stripped-override regression test
        run: scripts/stripped-override-test.sh
